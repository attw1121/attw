<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163d37">
  <title>報修登記｜問題有紀錄，處理更清楚</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="報修登記">
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
  <script defer src="./pwa.js"></script>
</head>
<body>
  <header class="site-header"><a href="./" class="brand"><span class="brand-icon" aria-hidden="true">＋</span> 報修登記</a><span class="demo-label">示範系統</span></header>
  <main>
    <div class="pwa-tools">
      <button id="install-button" class="secondary" type="button" hidden>安裝報修登記</button>
      <p class="install-help">加入手機主畫面：Android 使用瀏覽器「安裝應用程式」；iPhone 使用 Safari「分享 → 加入主畫面」。</p>
    </div>
    <p id="connection-message" class="message" role="status" aria-live="polite"></p>
    <p id="pwa-message" class="message" role="status" aria-live="polite"></p>
    <section class="intro"><p class="eyebrow">REPAIR DESK</p><h1>發現問題，<br>從這裡開始。</h1><p>留下問題與地點，讓每一筆報修都有紀錄。</p><p class="privacy">此清單公開可見，請使用虛構姓名、地點與示範內容。</p></section>
    <div class="workspace">
      <section class="panel form-panel" aria-labelledby="form-title">
        <div class="section-heading"><span class="step">01</span><div><h2 id="form-title">新增報修</h2><p>所有欄位皆為必填</p></div></div>
        <form id="repair-form">
          <label for="reporter_name">報修人</label><input id="reporter_name" name="reporter_name" maxlength="100" required placeholder="例如：虛構同事甲" autocomplete="off">
          <label for="location">地點或部門</label><input id="location" name="location" maxlength="200" required placeholder="例如：虛構園區 A 區" autocomplete="off">
          <div class="field-row"><div><label for="category">類別</label><select id="category" name="category" required><option value="">請選擇類別</option><option>設備</option><option>網路</option><option>環境</option><option>其他</option></select></div><div><label for="urgency">緊急程度</label><select id="urgency" name="urgency" required><option>低</option><option selected>中</option><option>高</option></select></div></div>
          <label for="description">問題說明</label><textarea id="description" name="description" maxlength="2000" rows="5" required placeholder="請描述問題與發生情況（最多 2000 字）"></textarea>
          <button type="submit" id="submit-button">送出報修 <span aria-hidden="true">↗</span></button>
          <p id="form-message" class="message" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="panel list-panel" aria-labelledby="list-title">
        <div class="section-heading"><span class="step">02</span><div><h2 id="list-title">最近報修</h2><p>最近 20 筆 · 最新在上</p></div><button id="refresh-button" class="secondary" type="button">重新整理</button></div>
        <div class="urgency-filters" role="group" aria-label="依緊急程度篩選">
          <button type="button" data-urgency="全部" aria-pressed="true">全部</button>
          <button type="button" data-urgency="高" aria-pressed="false">高</button>
          <button type="button" data-urgency="中" aria-pressed="false">中</button>
          <button type="button" data-urgency="低" aria-pressed="false">低</button>
        </div>
        <p class="filter-note">篩選範圍：已載入的最近 20 筆報修</p>
        <p id="filter-message" class="message" role="status" aria-live="polite"></p>
        <p id="list-message" class="message" role="status" aria-live="polite"></p>
        <ol id="request-list" class="request-list" aria-label="最近報修清單"></ol>
      </section>
    </div>
  </main>
  <footer>報修登記 · 每個小問題，都值得被看見。</footer>
</body>
</html>
